name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run validate
      - run: npm test
      - run: npm run bundle
      - run: node tools/bundle.mjs --lite
      - uses: actions/upload-artifact@v4
        with: { name: single-file, path: dist/*.html }
  deploy:
    # Publishes to GitHub Pages. Pages must be available for the repository (public repo, or a paid plan for private repos).
    # If it is not, this job fails while the check job above still proves the build; the single-file artifact is the fallback.
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # The site: the module app at the root (as before), plus hosted single-file copies at /lite/ and /full/ with
      # a manifest, PNG icons, and a service worker, so either can be added to a phone's home screen.
      - name: Assemble site
        run: |
          node tools/bundle.mjs --lite --pages
          node tools/bundle.mjs --pages
          mkdir -p _site
          rsync -a --exclude .git --exclude node_modules --exclude dist --exclude _site ./ _site/
          cp -r dist/pages/lite _site/lite
          cp -r dist/pages/full _site/full
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" _site/lite/sw.js _site/full/sw.js
          sed -i "s/const VERSION = 'pm-v[^']*'/const VERSION = 'pm-${GITHUB_SHA::12}'/" _site/sw.js
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
